server:
  port: 8084

spring:
  application:
    name: comment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comment_db}
    username: ${SPRING_DATASOURCE_USERNAME:threadly}
    password: ${SPRING_DATASOURCE_PASSWORD:threadly_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:threadly_dev_secret_key_at_least_32_bytes_long_123456}

services:
  post:
    url: ${POST_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${POST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${POST_READ_TIMEOUT_MS:5000}
