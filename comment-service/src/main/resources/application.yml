server:
  port: 8084

spring:
  application:
    name: comment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comment_db}
    username: ${SPRING_DATASOURCE_USERNAME:threadly}
    password: ${SPRING_DATASOURCE_PASSWORD:threadly_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:threadly_dev_secret_key_at_least_32_bytes_long_123456}

services:
  post:
    url: ${POST_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: ${POST_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${POST_READ_TIMEOUT_MS:5000}

kafka:
  topics:
    comment-created: ${KAFKA_TOPIC_COMMENT_CREATED:threadly.comment.created.v1}

outbox:
  poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
  batch-size: ${OUTBOX_BATCH_SIZE:50}
  kafka-timeout-ms: ${OUTBOX_KAFKA_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
